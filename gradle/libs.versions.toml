wearCompose = "1.4.1"
tiles = "1.4.1"
protolayout = "1.2.1"
healthServices = "1.0.0"
concurrentFutures = "1.2.0"
wearInput = "1.1.0"
junit = "4.13.2"
guava = "31.1-android"
playServicesWearable = "19.0.0"
coroutinesPlayServices = "1.10.2"
